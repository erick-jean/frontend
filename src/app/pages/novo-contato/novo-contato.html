<div class="container-contact">
  <div class="topbar-actions">
    <section class="section-title">
      <p class="eyebrow">Consulta cadastral</p>
      <h1>Pesquisar empresa por CNPJ</h1>
    </section>
    <div class="actions">
      <section class="bling-card" aria-label="Status da conexão com o Bling">
        <div>
          <span>Bling</span>
          <strong> Desconectado </strong>
        </div>
        <button type="button" class="ghost compact">Conectar</button>
      </section>
      <section class="credits-card" aria-label="Créditos restantes">
        <div>
          <span>Mensais</span>
          <strong>1000</strong>
        </div>
        <div>
          <span>Acumulados</span>
          <strong>500</strong>
        </div>
      </section>
    </div>
  </div>

  <div class="search-contact">
    <form class="form-contact">
      <mat-form-field appearance="outline"subscriptSizing="fixed">
        <mat-label>CNPJ</mat-label>
        <input
          type="text"
          matInput
          inputmode="numeric"
          [formControl]="cnpjFormControl"
          [errorStateMatcher]="matcher"
          mask="00.000.000/0000-00"
          placeholder="CNPJ com ou sem máscara"
        />

        @if (cnpjFormControl.hasError('cnpjInvalid')) {
          <mat-error> CNPJ inválido </mat-error>
        }

        @if (cnpjFormControl.hasError('required')) {
          <mat-error>CNPJ é <strong>obrigatório</strong></mat-error>
        }
      </mat-form-field>
      <button type="submit" class="btn-submit">Consultar CNPJ</button>
      <!-- <button type="submit" [disabled]="isConsulting">
        {{ isConsulting ? 'Consultando...' : 'Consultar CNPJ' }}
      </button> -->
    </form>
  </div>
</div>
